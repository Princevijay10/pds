name: PDS Daily Music Institute Post

on:
  schedule:
    # 06:00 Asia/Kolkata = 00:30 UTC.
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  send-daily-post:
    runs-on: ubuntu-latest
    steps:
      - name: Generate and send today's post
        env:
          AUTOMATION_SECRET: ${{ secrets.DAILY_POST_AUTOMATION_SECRET }}
          PDS_SERVER_URL: https://pds-server-s06a.onrender.com
        run: |
          set -euo pipefail
          if [ -z "$AUTOMATION_SECRET" ]; then
            echo "Missing GitHub secret: DAILY_POST_AUTOMATION_SECRET"
            exit 1
          fi

          curl --fail-with-body --show-error --silent \
            --retry 5 --retry-delay 15 --retry-all-errors \
            --max-time 300 \
            -X POST "$PDS_SERVER_URL/api/automation/daily-post" \
            -H "Content-Type: application/json" \
            -H "X-PDS-Automation-Secret: $AUTOMATION_SECRET"
